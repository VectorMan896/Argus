name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build Argus.csproj -c Release
      - name: Test
        run: dotnet test tests/Argus.Tests/Argus.Tests.csproj -c Release

  portable:
    # Only for version tags (v0.2.0, ...): builds the portable zip and attaches it, with its checksum, to a GitHub release.
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish portable build
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.zip.sha256
