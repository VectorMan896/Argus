name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build Argus.csproj -c Release
      - name: Test
        run: dotnet test tests/Argus.Tests/Argus.Tests.csproj -c Release

  portable:
    # Only for version tags (v0.2.0, ...): builds the portable zip and attaches it, with its checksum, to a GitHub release.
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish portable build
        shell: pwsh
        env:
          # optional: add these two repository secrets to get a signed Argus.exe (see docs/SIGNING.md); without them the build is unsigned
          ARGUS_SIGN_PFX_BASE64: ${{ secrets.ARGUS_SIGN_PFX_BASE64 }}
          ARGUS_SIGN_PASSWORD: ${{ secrets.ARGUS_SIGN_PASSWORD }}
        run: ./scripts/publish.ps1
      - name: Write release notes
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./scripts/release-notes.ps1 -Version $version -Out release-notes.md
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/*.zip
            dist/*.zip.sha256
